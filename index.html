<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HACCP - La Cava dei Vini</title>
  
  <!-- CSS nella radice principale -->
  <link rel="stylesheet" href="styles.css">

  <!-- jsPDF & AutoTable per Export PDF nello Storico -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

  <!-- Header Applicazione -->
  <header class="app-header">
    <h1>LA CAVA DEI VINI</h1>
    <p>Autocontrollo HACCP & Tracciabilità</p>
  </header>

  <!-- Container Dinamico per i Moduli -->
  <main id="app-container"></main>

  <!-- Bottom Navigation Bar (Fissa in Basso) -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="oggi">
      <span class="nav-icon">📊</span>
      <span>Oggi</span>
    </button>
    <button class="nav-btn" data-tab="temperature">
      <span class="nav-icon">❄️</span>
      <span>Temp</span>
    </button>
    <button class="nav-btn" data-tab="registro">
      <span class="nav-icon">🍳</span>
      <span>Cotture</span>
    </button>
    <button class="nav-btn" data-tab="pulizie">
      <span class="nav-icon">🧹</span>
      <span>Pulizie</span>
    </button>
    <button class="nav-btn" data-tab="anomalie">
      <span class="nav-icon">⚠️</span>
      <span>Anomalie</span>
    </button>
    <button class="nav-btn" data-tab="ricevimento">
      <span class="nav-icon">🚚</span>
      <span>Merci</span>
    </button>
    <button class="nav-btn" data-tab="etichette">
      <span class="nav-icon">🏷️</span>
      <span>Etichette</span>
    </button>
    <button class="nav-btn" data-tab="storico">
      <span class="nav-icon">📁</span>
      <span>Storico</span>
    </button>
  </nav>

  <!-- Script Principale (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
