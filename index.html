<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>La Cava · Registro HACCP</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#211C18">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="./main.css">
</head>
<body>
  <div id="root"><div class="empty">Caricamento...</div></div>

  <script>
    window.addEventListener('error', function(e) {
      document.getElementById('root').innerHTML = 
        '<div style="color:red; background:#fff; padding:20px; font-family:monospace; word-break:break-all;">' +
        '<b>ERRORE:</b> ' + e.message + '<br><br><b>FILE:</b> ' + e.filename + '<br><br><b>RIGA:</b> ' + e.lineno + 
        '</div>';
    });
  </script>

  <script type="module" src="./index.js"></script>
</body>
</html>
