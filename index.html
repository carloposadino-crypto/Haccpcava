<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HACCP - La Cava dei Vini</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2b5c3a">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3075/3075977.png">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="logo-title">
      <h1>La Cava dei Vini</h1>
      <p>Registro Operativo Autocontrollo HACCP</p>
    </div>
  </header>

  <!-- Contenuto dinamico delle pagine -->
  <main id="app-container">
    <!-- Le sezioni verranno iniettate qui tramite JS -->
  </main>

  <!-- Bottom Navigation Menu per Mobile -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="oggi">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Oggi</span>
    </button>
    <button class="nav-btn" data-tab="temperature">
      <span class="nav-icon">🌡️</span>
      <span class="nav-label">Temp</span>
    </button>
    <button class="nav-btn" data-tab="registro">
      <span class="nav-icon">🔥</span>
      <span class="nav-label">Cotture</span>
    </button>
    <button class="nav-btn" data-tab="pulizie">
      <span class="nav-icon">🧹</span>
      <span class="nav-label">Pulizie</span>
    </button>
    <button class="nav-btn" data-tab="anomalie">
      <span class="nav-icon">⚠️</span>
      <span class="nav-label">Anomalie</span>
    </button>
    <button class="nav-btn" data-tab="ricevimento">
      <span class="nav-icon">📦</span>
      <span class="nav-label">Merci</span>
    </button>
    <button class="nav-btn" data-tab="storico">
      <span class="nav-icon">📁</span>
      <span class="nav-label">Storico</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('Service Worker registrato con successo:', reg.scope))
          .catch(err => console.error('Errore registrazione Service Worker:', err));
      });
    }
  </script>
</body>
</html>
